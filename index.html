<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ESTUDOS · Mentoria de Alta Performance</title>
<meta name="theme-color" content="#0D1B2E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root {
  --bg: #0D1B2E; --bg2: #152642; --bg3: #1E3558;
  --surf: #1A2E45; --surf2: #213650; --surf3: #2A4363;
  --line: rgba(255,255,255,.08); --line2: rgba(255,255,255,.14);
  --fg: #F0F4F8; --fg2: #9DB3C8; --fg3: #5E7B96;
  --gold: #E8A020; --green: #1DB86A; --red: #E85A5A; --blue: #3B8EE8; --teal: #20C4B8; --purple: #9B5DE5; --orange: #F4742A;
  --display: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
  --r: 14px; --rs: 9px;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); font-family: var(--display); font-size: 14px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.wrap { max-width: 600px; margin: 0 auto; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

header { position: sticky; top: 0; z-index: 20; background: var(--bg2); border-bottom: 1px solid var(--line); }
.hd { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px 8px; }
.brand { display: flex; gap: 10px; align-items: center; min-width: 0; }
.mark { width: 38px; height: 38px; border-radius: 9px; flex-shrink: 0; display: grid; place-items: center; background: linear-gradient(135deg, var(--blue), var(--teal)); color: #fff; font-weight: 700; font-size: 13px; letter-spacing: -.5px; }
.bt { font-weight: 700; font-size: 15px; letter-spacing: -.3px; }
.bs { font-size: 10.5px; color: var(--fg2); text-transform: uppercase; letter-spacing: .5px; margin-top: 2px; }

.targets-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--bg3); }
.target-item { text-align: center; }
.target-item span { font-size: 9px; color: var(--fg2); text-transform: uppercase; display: block; }
.target-item b { font-family: var(--mono); font-size: 14px; color: var(--gold); }

nav.tabs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; padding-block: 8px; }
nav.tabs button { border: 1px solid var(--line2); background: transparent; color: var(--fg2); border-radius: var(--rs); padding: 6px 2px; font-size: 10px; font-weight: 600; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { background: var(--blue); border-color: var(--blue); color: #fff; }

main { padding-block: 14px 40px; display: grid; gap: 12px; }
h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--fg2); margin: 8px 0 0; font-weight: 600; }

.card { background: var(--surf); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; margin-bottom: 8px; }
.card.done { border-color: color-mix(in srgb, var(--green) 45%, transparent); }
.sess { display: flex; gap: 11px; padding: 12px 13px; align-items: flex-start; border-top: 1px solid var(--line); }
.sess:first-child { border-top: 0; }
.chk { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--line2); background: transparent; flex-shrink: 0; display: grid; place-items: center; color: #fff; font-size: 16px; font-weight: 700; transition: .15s; }
.chk[data-st="ok"] { background: var(--green); border-color: var(--green); }

.sb { flex: 1; min-width: 0; }
.st { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
.bd { font-size: 9.5px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; padding: 2px 7px; border-radius: 20px; background: var(--surf3); color: var(--fg2); }
.bd.manha { background: color-mix(in srgb, var(--orange) 20%, transparent); color: var(--orange); }
.bd.almoco { background: color-mix(in srgb, var(--teal) 20%, transparent); color: var(--teal); }
.bd.sabado { background: color-mix(in srgb, var(--purple) 22%, transparent); color: var(--purple); }
.bd.domingo { background: color-mix(in srgb, var(--blue) 20%, transparent); color: var(--blue); }

.tp { font-size: 14px; font-weight: 600; line-height: 1.3; }
.fo { font-size: 12px; color: var(--fg2); line-height: 1.45; margin-top: 4px; }

.fields { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line2); }
.fields label { display: grid; gap: 3px; font-size: 9px; color: var(--fg2); text-transform: uppercase; letter-spacing: .5px; }
.fields input { width: 100%; background: var(--surf2); border: 1px solid var(--line2); border-radius: 6px; padding: 6px; font-family: var(--mono); font-size: 14px; text-align: center; }

.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
.kpi { background: var(--surf); border: 1px solid var(--line); border-radius: var(--rs); padding: 12px 6px; text-align: center; }
.kpi b { display: block; font-family: var(--mono); font-size: 16px; font-weight: 600; color: var(--gold); }
.kpi span { font-size: 10px; color: var(--fg2); }

.topic { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 10px 13px; border-top: 1px solid var(--line); align-items: center; }
.topic:first-child { border-top: 0; }
.tbar { grid-column: 1 / -1; height: 6px; background: var(--surf3); border-radius: 3px; overflow: hidden; margin-top: 2px; }
.tbar i { display: block; height: 100%; border-radius: 3px; }

.tag-badge { font-size: 9.5px; font-weight: 700; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; font-family: var(--mono); }
.tag-critico { background: color-mix(in srgb, var(--red) 25%, transparent); color: var(--red); border: 1px solid var(--red); }
.tag-atencao { background: color-mix(in srgb, var(--gold) 25%, transparent); color: var(--gold); border: 1px solid var(--gold); }
.tag-otimo { background: color-mix(in srgb, var(--green) 25%, transparent); color: var(--green); border: 1px solid var(--green); }

form.err-form { background: var(--surf); border: 1px solid var(--line); border-radius: var(--r); padding: 13px; display: grid; gap: 9px; }
form.err-form label { display: grid; gap: 4px; font-size: 10px; text-transform: uppercase; color: var(--fg2); }
form.err-form select, form.err-form textarea { background: var(--surf2); border: 1px solid var(--line2); border-radius: 8px; padding: 8px; font-size: 13px; width: 100%; }
.btn { background: var(--blue); color: #fff; border: 0; border-radius: 8px; padding: 10px; font-weight: 700; width: 100%; }
.btn-anki { background: var(--teal); color: #0D1B2E; border: 0; border-radius: 8px; padding: 10px; font-weight: 700; width: 100%; margin-top: 10px; }
.sync-badge { font-size: 10px; text-align: center; color: var(--teal); font-family: var(--mono); padding: 4px; }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="hd">
      <div class="brand">
        <div class="mark">EST</div>
        <div>
          <div class="bt">Mentoria de Estudos · ESTUDOS</div>
          <div class="bs">Foco: Perícia Oficial MA &amp; PP-MA</div>
        </div>
      </div>
    </div>
    <div id="syncStatus" class="sync-badge">Conectando...</div>

    <div class="targets-bar">
      <div class="target-item"><span>Transpetro</span><b id="cdTransp">-</b></div>
      <div class="target-item"><span>Polícia Penal MA</span><b id="cdPPMA">-</b></div>
      <div class="target-item"><span>Perícia Oficial MA</span><b id="cdPericia">-</b></div>
    </div>

    <nav class="tabs" role="tablist">
      <button role="tab" id="tab-hoje" aria-selected="true" onclick="switchTab('hoje')">Hoje</button>
      <button role="tab" id="tab-amanha" aria-selected="false" onclick="switchTab('amanha')">Amanhã</button>
      <button role="tab" id="tab-semanas" aria-selected="false" onclick="switchTab('semanas')">Ciclo</button>
      <button role="tab" id="tab-progresso" aria-selected="false" onclick="switchTab('progresso')">Progresso</button>
      <button role="tab" id="tab-relatorio" aria-selected="false" onclick="switchTab('relatorio')">Relatório</button>
      <button role="tab" id="tab-erros" aria-selected="false" onclick="switchTab('erros')">Erros</button>
    </nav>
  </div>
</header>

<main class="wrap" id="mainApp"></main>

<script>
// COLE AQUI A URL DO SEU APPS SCRIPT (IMPLANTAÇÃO DO GOOGLE SHEETS)
const API_URL = "SUA_URL_DO_WEB_APP_AQUI";

const EXAMS = { transp: "2026-12-06", ppma: "2026-12-13", pericia: "2027-01-10" };

const WEEKLY_CYCLE = {
  1: [
    { id: "s_seg_1", t: "Manhã (05h-06h)", bd: "manha", m: 60, tp: "Língua Portuguesa (Cebraspe)", fo: "Teoria Ativa: Sintaxe, Concordância e Regência" },
    { id: "s_seg_2", t: "Almoço (1h15)", bd: "almoco", m: 75, tp: "Engenharia Civil: Materiais e Estruturas", fo: "20 Questões Cebraspe + Análise de gabarito" }
  ],
  2: [
    { id: "s_ter_1", t: "Manhã (05h-06h)", bd: "manha", m: 60, tp: "Direito Administrativo / Penal", fo: "Teoria/Lei Seca: Agentes Públicos ou Tipos Penais" },
    { id: "s_ter_2", t: "Almoço (1h15)", bd: "almoco", m: 75, tp: "Leis Extravagantes (PP-MA)", fo: "Lei de Execução Penal (LEP) - 20 Questões" }
  ],
  3: [
    { id: "s_qua_1", t: "Manhã (05h-06h)", bd: "manha", m: 60, tp: "Língua Portuguesa (Cebraspe)", fo: "Interpretação e Coesão Textual" },
    { id: "s_qua_2", t: "Almoço (1h15)", bd: "almoco", m: 75, tp: "Engenharia Civil: Orçamento e Planejamento", fo: "BDI, Curva ABC e SINAPI - 20 Questões" }
  ],
  4: [
    { id: "s_qui_1", t: "Manhã (05h-06h)", bd: "manha", m: 60, tp: "CPP: Perícias e Cadeia de Custódia", fo: "Arts. 158 a 184 do CPP (Foco Perícia Oficial)" },
    { id: "s_qui_2", t: "Almoço (1h15)", bd: "almoco", m: 75, tp: "Leis Extravagantes (PP-MA)", fo: "Abuso de Autoridade e Tortura - 20 Questões" }
  ],
  5: [
    { id: "s_sex_1", t: "Manhã (05h-06h)", bd: "manha", m: 60, tp: "Direito Constitucional / Administrativo", fo: "Art. 5º CF ou Organização do Estado" },
    { id: "s_sex_2", t: "Almoço (1h15)", bd: "almoco", m: 75, tp: "Engenharia Civil: Geotecnia e Hidrologia", fo: "Mecânica dos Solos - 20 Questões" }
  ],
  6: [
    { id: "s_sab_1", t: "Bloco Sábado (2h)", bd: "sabado", m: 120, tp: "Simulado Parcial Cebraspe", fo: "30 Q. Eng. Civil + 20 Q. Direitos / Legislação" },
    { id: "s_sab_2", t: "Bloco Sábado (2h)", bd: "sabado", m: 120, tp: "Revisão Geral e Caderno de Erros", fo: "Análise dos erros da semana + Ajuste de Anki" }
  ],
  0: [
    { id: "s_dom_1", t: "Domingo (4h)", bd: "domingo", m: 240, tp: "Prática de Redação Discursiva", fo: "1 Tema Modelo Cebraspe (Até 30 linhas) + Autocorreção" }
  ]
};

const TOPICS = [
  { id: "eng", n: "Engenharia Civil (Específicas)", defaultAcc: 68 },
  { id: "port", n: "Língua Portuguesa", defaultAcc: 82 },
  { id: "dir_penal", n: "Direito Penal & Processual Penal", defaultAcc: 62 },
  { id: "dir_ext", n: "Leis Extravagantes (PP-MA)", defaultAcc: 78 },
  { id: "adm_const", n: "Direito Adm. & Constitucional", defaultAcc: 88 }
];

let defaultStore = {
  sess: {},
  erros: [],
  anki: { rev: 92, new: 0, acc: 85 },
  subAcc: { "eng": 68, "port": 82, "dir_penal": 62, "dir_ext": 78, "adm_const": 88 }
};

let store = JSON.parse(localStorage.getItem("estudos_data_v4") || JSON.stringify(defaultStore));
let currentTab = "hoje";
let saveTimeout = null;

function setSyncStatus(msg) {
  const el = document.getElementById('syncStatus');
  if (el) el.textContent = msg;
}

// Carrega dados da Nuvem (Google Sheets)
async function fetchCloudStore() {
  if (!API_URL || API_URL.includes("SUA_URL_DO_WEB_APP_AQUI")) {
    setSyncStatus("Modo Offline (Configure a API_URL)");
    render();
    return;
  }
  
  setSyncStatus("Sincronizando dados...");
  try {
    const res = await fetch(API_URL);
    const data = await res.json();
    if (data && typeof data === 'object' && Object.keys(data).length > 0) {
      store = data;
      localStorage.setItem("estudos_data_v4", JSON.stringify(store));
      setSyncStatus("Sincronizado com a nuvem ✓");
    } else {
      setSyncStatus("Conectado (Nenhum dado salvo ainda)");
    }
  } catch (err) {
    setSyncStatus("Usando cópia local (Sem conexão)");
  }
  render();
}

// Salva dados na Nuvem
function saveStore() {
  localStorage.setItem("estudos_data_v4", JSON.stringify(store));
  render();

  if (!API_URL || API_URL.includes("SUA_URL_DO_WEB_APP_AQUI")) return;

  setSyncStatus("Salvando alterações...");
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(async () => {
    try {
      await fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(store)
      });
      setSyncStatus("Salvo na nuvem ✓");
    } catch (err) {
      setSyncStatus("Erro ao salvar na nuvem");
    }
  }, 800);
}

function getDaysDiff(targetIso) {
  const t = new Date(targetIso);
  const n = new Date();
  const diff = Math.ceil((t - n) / (1000 * 60 * 60 * 24));
  return diff > 0 ? diff + " dias" : "Hoje/Concluído";
}

function switchTab(t) {
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-selected', 'false'));
  document.getElementById('tab-' + t).setAttribute('aria-selected', 'true');
  currentTab = t;
  render();
}

function updateStatus(id, st) {
  if (!store.sess[id]) store.sess[id] = {};
  store.sess[id].st = st;
  saveStore();
}

function updateField(id, field, val) {
  if (!store.sess[id]) store.sess[id] = {};
  store.sess[id][field] = Number(val) || 0;
  saveStore();
}

function updateAnki(field, val) {
  store.anki[field] = Number(val) || 0;
  saveStore();
}

function updateSubAcc(id, val) {
  if (!store.subAcc) store.subAcc = {};
  store.subAcc[id] = Math.min(100, Math.max(0, Number(val) || 0));
  saveStore();
}

async function syncAnkiAuto() {
  const statusEl = document.getElementById('ankiStatus');
  if (statusEl) statusEl.textContent = "Conectando ao Anki Desktop...";

  try {
    const resRev = await fetch('http://127.0.0.1:8765', {
      method: 'POST',
      body: JSON.stringify({ action: 'getNumCardsReviewedToday', version: 6 })
    });
    const dataRev = await resRev.json();

    if (dataRev.result !== undefined) {
      store.anki.rev = dataRev.result;
      if (statusEl) statusEl.textContent = "Revisões sincronizadas!";
      saveStore();
    }
  } catch (err) {
    if (statusEl) statusEl.textContent = "Erro ao conectar com Anki Desktop local.";
  }
}

function addError(e) {
  e.preventDefault();
  const top = document.getElementById('errTop').value;
  const desc = document.getElementById('errDesc').value;
  if (!desc) return;
  if (!store.erros) store.erros = [];
  store.erros.push({ id: Date.now(), top, desc, date: new Date().toLocaleDateString('pt-BR') });
  saveStore();
}

function render() {
  document.getElementById('cdTransp').textContent = getDaysDiff(EXAMS.transp);
  document.getElementById('cdPPMA').textContent = getDaysDiff(EXAMS.ppma);
  document.getElementById('cdPericia').textContent = getDaysDiff(EXAMS.pericia);

  const main = document.getElementById('mainApp');
  main.innerHTML = "";

  const todayIndex = new Date().getDay();
  const tomorrowIndex = (todayIndex + 1) % 7;

  if (currentTab === "hoje" || currentTab === "amanha") {
    const dayKey = currentTab === "hoje" ? todayIndex : tomorrowIndex;
    const dayNames = ["Domingo", "Segunda-feira", "Terça-feira", "Quarta-feira", "Quinta-feira", "Sexta-feira", "Sábado"];
    const list = WEEKLY_CYCLE[dayKey] || [];

    let html = `<h2>${currentTab === 'hoje' ? 'Metas de Hoje' : 'Estudos do Dia Seguinte (' + dayNames[dayKey] + ')'}</h2>`;
    
    list.forEach(s => {
      const stData = (store.sess && store.sess[s.id]) || { st: 'none', min: s.m, q: 0, e: 0 };
      const st = stData.st || 'none';
      const pct = stData.q > 0 ? Math.round(((stData.q - stData.e) / stData.q) * 100) : 0;

      html += `
        <div class="card ${st === 'ok' ? 'done' : ''}">
          <div class="sess">
            <button class="chk" data-st="${st}" onclick="updateStatus('${s.id}', '${st === 'ok' ? 'none' : 'ok'}')">
              ${st === 'ok' ? '✓' : ''}
            </button>
            <div class="sb">
              <div class="st">
                <span class="bd ${s.bd}">${s.t}</span>
                <span style="font-size:11px; color:var(--fg2); font-family:var(--mono);">${s.m} min</span>
              </div>
              <div class="tp">${s.tp}</div>
              <div class="fo">${s.fo}</div>

              <div class="fields">
                <label>Minutos <input type="number" value="${stData.min ?? s.m}" onchange="updateField('${s.id}', 'min', this.value)"></label>
                <label>Questões <input type="number" value="${stData.q ?? 0}" onchange="updateField('${s.id}', 'q', this.value)"></label>
                <label>Erros <input type="number" value="${stData.e ?? 0}" onchange="updateField('${s.id}', 'e', this.value)"></label>
              </div>
              ${stData.q > 0 ? `<div style="margin-top:6px; font-size:11px; font-family:var(--mono); text-align:right; color:var(--fg2);">Aproveitamento: <b style="color:${pct >= 80 ? 'var(--green)' : 'var(--gold)'}">${pct}%</b></div>` : ''}
            </div>
          </div>
        </div>
      `;
    });
    main.innerHTML = html;
  }

  else if (currentTab === "semanas") {
    let html = `<h2>Ciclo Semanal Completo (Segunda a Domingo)</h2>`;
    const dayLabels = { 1: "Segunda-feira", 2: "Terça-feira", 3: "Quarta-feira", 4: "Quinta-feira", 5: "Sexta-feira", 6: "Sábado", 0: "Domingo" };
    
    [1, 2, 3, 4, 5, 6, 0].forEach(dNum => {
      html += `<div class="card" style="padding:10px 13px;"><div style="font-weight:700; color:var(--gold); margin-bottom:6px; font-size:12px; text-transform:uppercase;">${dayLabels[dNum]}</div>`;
      WEEKLY_CYCLE[dNum].forEach(s => {
        html += `<div style="font-size:13px; margin-top:4px;"><b>[${s.t}]</b> ${s.tp} <span style="color:var(--fg2); font-size:11px;">(${s.m}m)</span></div>`;
      });
      html += `</div>`;
    });
    main.innerHTML = html;
  }

  else if (currentTab === "progresso") {
    let totalMin = 0, totalQ = 0, totalE = 0;
    if (store.sess) {
      Object.values(store.sess).forEach(s => {
        totalMin += (s.min || 0); totalQ += (s.q || 0); totalE += (s.e || 0);
      });
    }
    const hrs = (totalMin / 60).toFixed(1);
    const acc = totalQ > 0 ? Math.round(((totalQ - totalE) / totalQ) * 100) : 0;

    let html = `
      <h2>Indicadores de Desempenho</h2>
      <div class="kpis">
        <div class="kpi"><b>${hrs}h</b><span>Horas Líquidas</span></div>
        <div class="kpi"><b>${totalQ}</b><span>Questões</span></div>
        <div class="kpi"><b>${acc}%</b><span>Acertos</span></div>
      </div>
      <h2>Aproveitamento Geral</h2>
      <div class="card">
    `;
    TOPICS.forEach(t => {
      const val = store.subAcc ? (store.subAcc[t.id] ?? t.defaultAcc) : t.defaultAcc;
      const barColor = val < 70 ? 'var(--red)' : (val < 85 ? 'var(--gold)' : 'var(--green)');
      html += `<div class="topic"><div style="font-weight:600;">${t.n}</div><div style="font-family:var(--mono); font-size:12px; color:var(--fg2);">${val}%</div><div class="tbar"><i style="width:${val}%; background:${barColor};"></i></div></div>`;
    });
    html += `</div>`;
    main.innerHTML = html;
  }

  else if (currentTab === "relatorio") {
    let totalMin = 0, totalQ = 0, totalE = 0;
    if (store.sess) {
      Object.values(store.sess).forEach(s => {
        totalMin += (s.min || 0); totalQ += (s.q || 0); totalE += (s.e || 0);
      });
    }
    const hrs = (totalMin / 60).toFixed(1);
    const acc = totalQ > 0 ? Math.round(((totalQ - totalE) / totalQ) * 100) : 0;
    const ankiStore = store.anki || { rev: 0, new: 0, acc: 0 };

    const rankedTopics = [...TOPICS].map(t => {
      const val = store.subAcc ? (store.subAcc[t.id] ?? t.defaultAcc) : t.defaultAcc;
      return { ...t, acc: val };
    }).sort((a, b) => a.acc - b.acc);

    let rankingHtml = rankedTopics.map((t, idx) => {
      let badgeClass = "tag-critico";
      let statusText = "🔴 Crítico";
      let barColor = "var(--red)";

      if (t.acc >= 85) {
        badgeClass = "tag-otimo";
        statusText = "🟢 Domínio Excelente";
        barColor = "var(--green)";
      } else if (t.acc >= 70) {
        badgeClass = "tag-atencao";
        statusText = "🟡 Atenção / Ajuste";
        barColor = "var(--gold)";
      }

      return `
        <div style="padding:10px; border-bottom:1px solid var(--line); display:grid; gap:4px;">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-weight:600; font-size:13px;">${idx + 1}º ${t.n}</span>
            <span class="tag-badge ${badgeClass}">${statusText}</span>
          </div>
          <div style="display:flex; justify-content:space-between; align-items:center; font-size:11px; color:var(--fg2);">
            <span>Retenção/Acerto: <b style="color:var(--fg);">${t.acc}%</b></span>
            <span>Ajustar Retenção: <input type="number" value="${t.acc}" style="width:45px; background:var(--surf2); border:1px solid var(--line2); color:#fff; text-align:center; border-radius:4px; font-family:var(--mono);" onchange="updateSubAcc('${t.id}', this.value)">%</span>
          </div>
          <div class="tbar"><i style="width:${t.acc}%; background:${barColor};"></i></div>
        </div>
      `;
    }).join('');

    main.innerHTML = `
      <h2>Relatório Geral de KPIs &amp; Anki</h2>
      <div class="kpis">
        <div class="kpi"><b>${hrs}h</b><span>Estudo Total</span></div>
        <div class="kpi"><b>${acc}%</b><span>Questões Cebraspe</span></div>
        <div class="kpi"><b>${ankiStore.acc}%</b><span>Retenção Anki</span></div>
      </div>

      <div class="card" style="padding:14px;">
        <div style="font-weight:700; margin-bottom:10px; color:var(--gold); text-transform:uppercase; font-size:11px;">Sincronização com o Anki Desktop</div>
        
        <button class="btn-anki" onclick="syncAnkiAuto()">🔄 Puxar Dados do Anki Desktop</button>
        <div id="ankiStatus" style="font-size:11px; color:var(--gold); margin-top:8px; text-align:center;"></div>

        <div class="fields" style="margin-top:12px;">
          <label>Cards Revisados Hoje <input type="number" value="${ankiStore.rev}" onchange="updateAnki('rev', this.value)"></label>
          <label>Cards Novos <input type="number" value="${ankiStore.new}" onchange="updateAnki('new', this.value)"></label>
          <label>% Retenção Geral <input type="number" value="${ankiStore.acc}" onchange="updateAnki('acc', this.value)"></label>
        </div>
      </div>

      <h2>🚨 Ranking Visual de Fraquezas por Matéria</h2>
      <div class="card">
        ${rankingHtml}
      </div>
    `;
  }

  else if (currentTab === "erros") {
    const errosList = store.erros || [];
    let html = `
      <h2>Caderno de Erros (Cebraspe)</h2>
      <form class="err-form" onsubmit="addError(event)">
        <label>Disciplina / Tópico
          <select id="errTop">${TOPICS.map(t => `<option value="${t.n}">${t.n}</option>`).join('')}</select>
        </label>
        <label>O que você errou? (Ponto de atenção / Pegadinha)
          <textarea id="errDesc" placeholder="Ex: Confundi responsabilidade objetiva..."></textarea>
        </label>
        <button class="btn" type="submit">Salvar no Caderno de Erros</button>
      </form>
      <h2>Histórico (${errosList.length})</h2>
    `;
    errosList.slice().reverse().forEach(e => {
      html += `<div class="card" style="padding:12px;"><div style="font-size:10px; color:var(--gold); font-weight:700; text-transform:uppercase;">${e.top} · ${e.date}</div><div style="font-size:13px; margin-top:4px;">${e.desc}</div></div>`;
    });
    main.innerHTML = html;
  }
}

// Inicializa a conexão com a nuvem
fetchCloudStore();
</script>
</body>
</html>
